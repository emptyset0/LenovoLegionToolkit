name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:

    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Restore
      run: dotnet restore
    - name: Prepare identity package signing key
      env:
        LLT_CERT_PFX: ${{ secrets.LLT_CERT_PFX }}
        LLT_CERT_PASSWORD: ${{ secrets.LLT_CERT_PASSWORD }}
      run: |
        function Add-GitHubEnv {
          param(
            [Parameter(Mandatory)]
            [string]$Name,

            [Parameter(Mandatory)]
            [string]$Value
          )

          $delimiter = "EOF_$([guid]::NewGuid().ToString("N"))"
          Add-Content -Path $env:GITHUB_ENV -Value "$Name<<$delimiter"
          Add-Content -Path $env:GITHUB_ENV -Value $Value
          Add-Content -Path $env:GITHUB_ENV -Value $delimiter
        }

        if ($env:LLT_CERT_PFX -and $env:LLT_CERT_PASSWORD) {
          [IO.File]::WriteAllBytes("LenovoLegionToolkit.pfx", [Convert]::FromBase64String($env:LLT_CERT_PFX))
          Add-GitHubEnv -Name "LLT_CERT_PASSWORD" -Value $env:LLT_CERT_PASSWORD
          return
        }

        Write-Warning "LLT_CERT_PFX or LLT_CERT_PASSWORD secret is missing. Generating a temporary CI signing certificate."

        $password = [guid]::NewGuid().ToString("N")
        $securePassword = ConvertTo-SecureString -String $password -AsPlainText -Force
        $cert = New-SelfSignedCertificate `
          -Type CodeSigningCert `
          -Subject "CN=LenovoLegionToolkit" `
          -FriendlyName "Lenovo Legion Toolkit CI" `
          -KeyExportPolicy Exportable `
          -CertStoreLocation "Cert:\CurrentUser\My"

        Export-PfxCertificate -Cert $cert -FilePath "LenovoLegionToolkit.pfx" -Password $securePassword | Out-Null
        Export-Certificate -Cert $cert -FilePath "LenovoLegionToolkit.cer" | Out-Null
        Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force
        Add-GitHubEnv -Name "LLT_CERT_PASSWORD" -Value $password
      shell: powershell
    - name: Build
      run: .\make_action.bat
    - name: Verify installer
      run: |
        $installerPath = "build_installer\LenovoLegionToolkitSetup.exe"
        if (-not (Test-Path $installerPath)) {
          Write-Error "Installer file not found at $installerPath"
          exit 1
        }
      shell: powershell
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: build_installer\LenovoLegionToolkitSetup.exe
